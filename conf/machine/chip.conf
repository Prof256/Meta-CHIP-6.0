#@TYPE: Machine
#@NAME: Next Thing Co. C.H.I.P.
#@DESCRIPTION: Machine configuration for the Next Thing Co. C.H.I.P. $9 single-board computer (Allwinner R8 / sun5i)

require conf/machine/include/tune-cortexa8.inc

DEFAULTTUNE ?= "cortexa8t-neon"

# Serial console: UART0 (pins on header U14: TX=pin 3, RX=pin 5)
SERIAL_CONSOLES ?= "115200;ttyS0"

# Bootloader: Mainline Das U-Boot
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"
PREFERRED_PROVIDER_u-boot ?= "u-boot"
UBOOT_MACHINE ?= "CHIP_defconfig"
UBOOT_BINARY ?= "u-boot-sunxi-with-spl.bin"
SPL_BINARY ?= "sunxi-spl.bin"

# Kernel: Mainline Linux (via linux-yocto or custom recipe)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
KERNEL_IMAGETYPE ?= "zImage"
# In Linux 6.x+, ARM 32-bit devicetrees are located under vendor subdirectories
KERNEL_DEVICETREE ?= "allwinner/sun5i-r8-chip.dtb"

# Hardware Features
MACHINE_FEATURES = "apm usbgadget usbhost vfat alsa wifi bluetooth screen"
MACHINE_EXTRA_RRECOMMENDS += " \
    kernel-modules \
    kernel-devicetree \
    chip-boot-scr \
    linux-firmware-rtl8723 \
"

# Default image filesystem types:
# - ubi: for direct flashing to onboard NAND flash
# - tar.xz: for rootfs archive / NFS / recovery
# - ext4: for USB storage or SD card breakout adapter
IMAGE_FSTYPES ?= "ubi tar.xz ext4"

# =========================================================================
# NAND Flash & UBI Settings
# =========================================================================
# C.H.I.P. boards shipped with either:
# 1) Hynix H27UCG8T2ETR (8GB/4GB MLC NAND, 16KB page, 2MB PEB) [DEFAULT]
# 2) Toshiba TC58NVG1S3HTA00 (2GB/4GB SLC NAND, 2KB/4KB page, 256KB PEB)
# =========================================================================
CHIP_NAND_TYPE ?= "hynix-mlc"

# Default: Hynix MLC NAND configuration
CHIP_UBI_PAGE_SIZE ?= "16384"
CHIP_UBI_PEB_SIZE ?= "2097152"
CHIP_UBI_LEB_SIZE ?= "2064384"
CHIP_UBI_MAX_LEB_CNT ?= "2000"

MKUBIFS_ARGS ?= "-m ${CHIP_UBI_PAGE_SIZE} -e ${CHIP_UBI_LEB_SIZE} -c ${CHIP_UBI_MAX_LEB_CNT}"
UBINIZE_ARGS ?= "-m ${CHIP_UBI_PAGE_SIZE} -p ${CHIP_UBI_PEB_SIZE} -s ${CHIP_UBI_PAGE_SIZE}"
UBI_VOLNAME ?= "rootfs"

EXTRA_IMAGEDEPENDS += "u-boot chip-boot-scr"

